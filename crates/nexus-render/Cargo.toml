[package]
name = "nexus-render"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
base64 = "0.22"
fontdue = "0.9"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "gif"] }
nexus-config = { path = "../nexus-config" }
nexus-core = { path = "../nexus-core" }
resvg = { version = "0.48", default-features = false }
tiny-skia = "0.12"
usvg = { version = "0.48", default-features = false }
