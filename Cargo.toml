[workspace]
members = [
  "crates/nexus-core",
  "crates/nexus-render",
  "crates/nexus-sensors",
  "crates/nexus-actions",
  "crates/nexus-config",
  "crates/nexus-events",
  "crates/nexus-input",
  "crates/nexus-ipc",
  "crates/nexus-pack",
  "crates/nexus-daemon",
  "crates/nexus-inputd",
  "crates/nexus-studio",
  "crates/nexusctl",
]
resolver = "2"

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
hidapi = { version = "2.6", default-features = false, features = ["linux-native"] }
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
libc = "0.2"
rumqttc = "0.25"
